<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#000000">
    <title>JoJo Web Console</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.5/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
    <main id="tv-container" aria-label="Modo TV">
        <div id="game"></div>
        <div id="qrcode" aria-label="QR Code do comando"></div>
        <div id="tv-status" role="status" aria-live="polite"></div>
    </main>

    <main id="controller-container" aria-label="Modo Controle">
        <div id="controller-status" role="status" aria-live="polite"></div>

        <section class="controller-top" aria-label="Botões de sistema">
            <button class="system-button" type="button" data-button="SELECT">Select</button>
            <button class="system-button" type="button" data-button="START">Start</button>
        </section>

        <section class="controller-main" aria-label="Comandos">
            <div class="dpad" aria-label="Direcional">
                <button class="control-button dpad-button dpad-up" type="button" data-button="UP" aria-label="Cima">▲</button>
                <button class="control-button dpad-button dpad-left" type="button" data-button="LEFT" aria-label="Esquerda">◀</button>
                <button class="control-button dpad-button dpad-right" type="button" data-button="RIGHT" aria-label="Direita">▶</button>
                <button class="control-button dpad-button dpad-down" type="button" data-button="DOWN" aria-label="Baixo">▼</button>
                <div class="dpad-center" aria-hidden="true"></div>
            </div>

            <div class="face-buttons" aria-label="Botões de ataque">
                <button class="control-button face-button" type="button" data-button="LP" aria-label="Soco Fraco">LP</button>
                <button class="control-button face-button" type="button" data-button="MP" aria-label="Soco Médio">MP</button>
                <button class="control-button face-button" type="button" data-button="HP" aria-label="Soco Forte">HP</button>
                <button class="control-button face-button" type="button" data-button="LK" aria-label="Chute Fraco">LK</button>
                <button class="control-button face-button" type="button" data-button="MK" aria-label="Chute Médio">MK</button>
                <button class="control-button face-button" type="button" data-button="HK" aria-label="Chute Forte">HK</button>
            </div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
